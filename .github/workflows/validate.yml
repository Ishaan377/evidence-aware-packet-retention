name: Validate EBR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -B -m unittest final/tests/test_ebr.py
      - name: Check third sealed test hash
        run: python -B final/freeze.py check v3
